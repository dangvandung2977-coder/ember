# Version pins — Paper 26.x uses build-numbered releases (NOT 1.x-style -R0.1-SNAPSHOT).
ember.artifact.version=0.1.0
ember.paper.api.version=26.2.build.117-stable

# Java 25 toolchain (Paper 26.1+ REQUIRES Java 25 — this is not optional).
# If you only have JDK 21, install a JDK 25 (Temurin/Oracle/Adoptium) and point
# JAVA_HOME / toolchain at it. The build will NOT compile with JDK 21.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# JUnit BOM pin.
ember.junit.version=5.10.2
